{% extends 'catalog/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<a href="{% url 'blog:blogpost_list' %}" class="btn btn-outline-secondary mb-3">← Назад</a>
<article>
    <h1>{{ post.title }}</h1>
    <p class="text-muted">Дата: {{ post.created_at|date:"d M Y" }} | Просмотров: {{ post.views_count }}</p>
    {% if post.preview %}
        <img src="{{ post.preview.url }}" class="img-fluid mb-3" alt="{{ post.title }}">
    {% endif %}
    <p>{{ post.content }}</p>
    <a href="{% url 'blog:blogpost_edit' post.pk %}" class="btn btn-secondary">Редактировать</a>
    <a href="{% url 'blog:blogpost_delete' post.pk %}" class="btn btn-danger">Удалить</a>
</article>
{% endblock %}
