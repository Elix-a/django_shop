{% extends 'catalog/base.html' %}

{% block title %}Форма статьи{% endblock %}

{% block content %}
<h1>{% if object %}Редактировать статью{% else %}Создать статью{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'blog:blogpost_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
